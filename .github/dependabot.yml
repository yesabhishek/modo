version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # GPUI Kit is pinned exactly; upgrade it by hand after a visual review.
    ignore:
      - dependency-name: gpui-kit
    open-pull-requests-limit: 5
