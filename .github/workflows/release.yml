name: Release
# Push a tag like v0.2.0 to build installers for every platform and publish
# them as a GitHub release anyone can download.
#
# Third-party actions are pinned to full commit hashes (Dependabot keeps them
# current), release builds start from an empty cache, and the published
# SHA256SUMS file is signed with the key whose public half is in
# src/brand.rs, so a release made without that key does not install.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-15 }
          - { name: Windows, os: windows-2025 }
          # The oldest supported Ubuntu, so the .deb runs on older distributions too.
          - { name: Linux, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          scripts/package-macos.sh --universal
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          choco install nsis --version 3.13.0 -y --no-progress
          $env:PATH = "${env:ProgramFiles(x86)}\NSIS;$env:PATH"
          ./scripts/package-windows.ps1
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev
          scripts/package-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modo-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz
            dist/*.deb
            dist/*SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected="$(sed -n 's/^pub const RELEASE_KEY: &str = "\([0-9a-f]*\)";/\1/p' source/src/brand.rs)"
          if [[ -z "$expected" || -z "$RELEASE_SIGNING_KEY" ]]; then
            echo "::error::Set RELEASE_KEY in src/brand.rs and the RELEASE_SIGNING_KEY secret (scripts/release-key.sh)."
            exit 1
          fi
          key="$RUNNER_TEMP/signing.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          public="$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')"
          if [[ "$public" != "$expected" ]]; then
            echo "::error::RELEASE_SIGNING_KEY does not match RELEASE_KEY in src/brand.rs."
            exit 1
          fi
          sums="modo-$version-SHA256SUMS.txt"
          (cd dist && sha256sum -- *.dmg *.zip *.exe *.tar.gz *.deb > "$sums")
          openssl pkeyutl -sign -inkey "$key" -rawin -in "dist/$sums" | od -An -tx1 | tr -d ' \n' > "dist/$sums.sig"
          echo >> "dist/$sums.sig"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz
            dist/*.deb
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## Install"
            echo
            echo "- **macOS 12+**: download \`modo-$version-macos-universal.dmg\`, open it, and drag Modo to Applications. Modo is not notarized yet, so the first launch needs one approval: System Settings > Privacy & Security > **Open Anyway**."
            echo "- **Windows 10+**: run \`modo-$version-windows-x64-setup.exe\`. If SmartScreen appears, choose More info > Run anyway."
            echo "- **Ubuntu / Debian**: \`sudo apt install ./modo_${version}_amd64.deb\`"
            echo "- **Other Linux**: extract \`modo-$version-linux-x86_64.tar.gz\` and run \`./modo\`."
            echo
            echo "Check a download: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
            echo
            awk '/^## /{n++} n==1 && !/^## /' source/CHANGELOG.md
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Modo $version" --notes-file notes.md --latest
