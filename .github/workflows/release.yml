name: Release
# Push a tag like v0.2.0 to build installers for every platform and publish
# them as a GitHub release anyone can download.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-15 }
          - { name: Windows, os: windows-2025 }
          # The oldest supported Ubuntu, so the .deb runs on older distributions too.
          - { name: Linux, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          scripts/package-macos.sh --universal
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          choco install nsis -y --no-progress
          $env:PATH = "${env:ProgramFiles(x86)}\NSIS;$env:PATH"
          ./scripts/package-windows.ps1
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev
          scripts/package-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: modo-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz
            dist/*.deb
            dist/*SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: source
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## Install"
            echo
            echo "- **macOS 12+**: download \`modo-$version-macos-universal.dmg\`, open it, and drag Modo to Applications. Modo is not notarized, so on first launch go to System Settings > Privacy & Security and click **Open Anyway** (or run \`xattr -dr com.apple.quarantine /Applications/Modo.app\`)."
            echo "- **Windows 10+**: run \`modo-$version-windows-x64-setup.exe\`. If SmartScreen appears, choose More info > Run anyway."
            echo "- **Ubuntu / Debian**: \`sudo apt install ./modo_${version}_amd64.deb\`"
            echo "- **Other Linux**: extract \`modo-$version-linux-x86_64.tar.gz\` and run \`./modo\`."
            echo
            awk '/^## /{n++} n==1 && !/^## /' source/CHANGELOG.md
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Modo $version" --notes-file notes.md --latest
